<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rantautumispaikkojen analysointi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; background: #cfe8ef; }
  .legend {
    background: white; padding: 8px 12px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); font-size: 13px; line-height: 1.5;
  }
  .legend .swatch {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px;
    vertical-align: middle; border-radius: 2px;
  }
  .legend-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; cursor: pointer; user-select: none;
  }
  .legend-toggle {
    font-weight: bold; font-size: 15px; line-height: 1; color: #555;
  }
  .legend-body { margin-top: 6px; }
  .legend-body.collapsed { display: none; }
  .status {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: white; padding: 6px 14px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); font-size: 13px; z-index: 1000;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="status" id="status">Ladataan tiiliä...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Peruskartta pysyy muuttumattomana natiivissa EPSG:3067-projektiossaan
// (ei rotaatiota, ks. backend/pipeline.py:n docstring) - kaikki muu data on
// resamploitu samalle ruudukolle. Leaflet piirtaa siis suoraan EPSG:3067-
// metrit "lat/lng"-pareina (pohjoinen=lat, ita=lng) L.CRS.Simple:lla, jonka
// project()/unproject() on identiteetti - ei geodeettista muunnosta, ei
// proj4-riippuvuutta, silti pikselintarkka ja saumaton lopputulos.
const map = L.map('map', { crs: L.CRS.Simple, zoomSnap: 0.25, minZoom: -10, maxZoom: 6 });

const baseLayerGroup = L.layerGroup().addTo(map);
const scoreLayerGroup = L.layerGroup().addTo(map);
const topLayerGroup = L.layerGroup();

L.control.layers(null, {
  'Rantautumispisteytys': scoreLayerGroup,
  'Parhaat rantautumispaikat (top 7%)': topLayerGroup,
}, { collapsed: false }).addTo(map);

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<div class="legend-header">' +
      '<b>Rantautumispiste</b>' +
      '<span class="legend-toggle">&minus;</span>' +
    '</div>' +
    '<div class="legend-body">' +
      '<span class="swatch" style="background:#00ff00"></span>Hyvä<br>' +
      '<span class="swatch" style="background:#ffff00"></span>Kohtalainen<br>' +
      '<span class="swatch" style="background:#ff0000"></span>Heikko<br>' +
      '<span class="swatch" style="background:#ff00ff"></span>Paras 7% (oma kerros)<br>' +
      '<small>Rantaviivan laatu perustuu 5–15&nbsp;m puskurivyöhykkeeseen,<br>' +
      'visuaalisesti paksunnettuna näkyvyyden vuoksi.<br>' +
      'Suo alentaa pistettä merkittävästi.</small>' +
    '</div>';

  L.DomEvent.disableClickPropagation(div);

  const header = div.querySelector('.legend-header');
  const body = div.querySelector('.legend-body');
  const toggle = div.querySelector('.legend-toggle');
  header.addEventListener('click', () => {
    const collapsing = !body.classList.contains('collapsed');
    body.classList.toggle('collapsed', collapsing);
    toggle.innerHTML = collapsing ? '&plus;' : '&minus;';
  });

  return div;
};
legend.addTo(map);
let tileListCache = [];
let topVisible = false;

// Moniresoluutioiset tasot ulompia zoomauksia varten (ks.
// backend/pipeline.py: LEVEL_FACTORS). "suffix" vastaa tallennettujen
// kuvien tiedostonimen paatetta - "" = detail-taso, ei suffiksia.
// maxZoom on YLARAJA (poissulkeva): taso kaytossa kun zoom < maxZoom.
// Kynnykset ovat puolivalissa perakkaisten tasojen omaa natiiviresoluutiota
// vastaavien zoom-tasojen valissa (L.CRS.Simple: 1 karttayksikko = 1m,
// resoluutio zoomilla z on 2^-z m/px - natiivit: overview 16m/px -> z=-4,
// mid 4m/px -> z=-2, near 2m/px -> z=-1, detail 1m/px -> z=0).
const LEVELS = [
  { name: 'overview', suffix: '_overview', maxZoom: -3 },
  { name: 'mid', suffix: '_mid', maxZoom: -1.5 },
  { name: 'near', suffix: '_near', maxZoom: -0.5 },
  { name: 'detail', suffix: '', maxZoom: Infinity },
];

function levelForZoom(zoom) {
  return LEVELS.find((l) => zoom < l.maxZoom) || LEVELS[LEVELS.length - 1];
}

function tileLatLngBounds(tile) {
  // EPSG:3067-metrit suoraan lat/lng-pareina (ks. yllä), ei muunnosta.
  const b = tile.bounds_epsg3067;
  return [[b.miny, b.minx], [b.maxy, b.maxx]];
}

function tileIntersectsView(tile, view) {
  const b = tile.bounds_epsg3067;
  return !(b.maxx < view.minx || b.minx > view.maxx || b.maxy < view.miny || b.miny > view.maxy);
}

function currentViewBounds() {
  const b = map.getBounds();
  return { minx: b.getWest(), miny: b.getSouth(), maxx: b.getEast(), maxy: b.getNorth() };
}

// Ladataan tasosta riippuen vain naytossa juuri nyt olevien tiilien kuvat -
// karkeampi yleistaso lataa nopeasti heti, tarkempi taso vain sille
// alueelle johon kayttaja on zoomannut/panoroinut (ks. instructions.md).
function refreshLayers() {
  const level = levelForZoom(map.getZoom());
  const view = currentViewBounds();
  const visible = tileListCache.filter((tile) => tileIntersectsView(tile, view));

  baseLayerGroup.clearLayers();
  scoreLayerGroup.clearLayers();
  visible.forEach((tile) => {
    const bounds = tileLatLngBounds(tile);
    L.imageOverlay(`/api/basemap/${tile.tile_id}${level.suffix}.png`, bounds, { opacity: 1 })
      .addTo(baseLayerGroup);
    L.imageOverlay(`/api/overlay/${tile.tile_id}${level.suffix}.png`, bounds, { opacity: 1 })
      .addTo(scoreLayerGroup);
  });

  if (topVisible) {
    topLayerGroup.clearLayers();
    visible.forEach((tile) => {
      L.imageOverlay(`/api/overlay/${tile.tile_id}/top${level.suffix}.png`, tileLatLngBounds(tile), { opacity: 1 })
        .addTo(topLayerGroup);
    });
  }
}

map.on('overlayadd', (e) => {
  if (e.name.startsWith('Parhaat')) {
    topVisible = true;
    refreshLayers();
  }
});
map.on('overlayremove', (e) => {
  if (e.name.startsWith('Parhaat')) {
    topVisible = false;
    topLayerGroup.clearLayers();
  }
});
map.on('zoomend moveend', () => {
  if (tileListCache.length) refreshLayers();
});

async function init() {
  const statusEl = document.getElementById('status');
  const res = await fetch('/api/tiles');
  const tileList = await res.json();
  tileListCache = tileList;

  const allBounds = tileList.map(tileLatLngBounds);
  if (allBounds.length) {
    // Avataan hieman lahempaa kuin taysi "koko aineisto nakyvissa" -taso:
    // yksi zoom-askel enemman (L.CRS.Simple: 2x resoluutio per askel) eli
    // nakyvissa on karkeasti puolet koko aineiston fit-to-bounds-leveydesta.
    const overallBounds = L.latLngBounds(allBounds);
    const fitZoom = map.getBoundsZoom(overallBounds);
    map.setView(overallBounds.getCenter(), fitZoom + 1);
  } else {
    map.setView([0, 0], -6);
  }

  refreshLayers();
  statusEl.remove();
}

init().catch((err) => {
  document.getElementById('status').textContent = 'Virhe ladattaessa: ' + err;
});
</script>
</body>
</html>
