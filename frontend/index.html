// HSV(H asteina 0-360, S,V 0-1) -> [r,g,b] 0-255. Vastaa backendin
// score_to_rgba:n varitysta: siella H_cv = score*60 OpenCV:n 0-179-
// asteikolla, eli H asteina = 2*H_cv = 120*score.
function hsvToRgb(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

const SCORE_COLOR_LUT = Array.from({ length: 256 }, (_, i) => hsvToRgb((i / 255) * 120, 1, 1));

// Yksinkertainen, erotettava (kaksi 1D-pyyhkaisya) neliomainen dilataatio
// alfamaskille - halpa pienelle karkean resoluution kuvalle (ks.
// NEW_PIXEL_FACTOR), toisin kuin sama operaatio olisi natiivilla 1x1m-
// resoluutiolla (siksi tama kokeiltiin AIEMMIN hylatylla SVG feMorphology
// -suodattimella, ks. THICKNESS_PRESETS-kommentti). Kaytetaan "top"-tilassa,
// jossa vari on aina kiintea (magenta) - ei tarvetta varin alkuperalle.
function dilateAlpha(alpha, w, h, radiusPx) {
  if (radiusPx <= 0) return alpha;
  const tmp = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let hit = 0;
      for (let dx = -radiusPx; dx <= radiusPx; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < w && alpha[y * w + xx]) { hit = 1; break; }
      }
      tmp[y * w + x] = hit;
    }
  }
  const out = new Uint8Array(w * h);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      let hit = 0;
      for (let dy = -radiusPx; dy <= radiusPx; dy++) {
        const yy = y + dy;
        if (yy >= 0 && yy < h && tmp[yy * w + x]) { hit = 1; break; }
      }
      out[y * w + x] = hit;
    }
  }
  return out;
}

// Dilataatio JOKA MYOS levittaa lahimman OIKEAN nakyvan pikselin indeksin
// (ei vain nakyvyyden) - kaytetaan "rantautumispisteytys"-tilassa, jossa
// vari riippuu sijainnista (score). Ilman tata dilatoidut ("paksunnetut")
// reunapikselit varittyisivat OMALLA raa'alla pistemaarallaan, joka on
// puskurivyohykkeen ULKOPUOLELLA (esim. aivan rantaviivan tuntumassa)
// mielivaltainen/ei koskaan tarkoitettu naytettavaksi - nain syntyi
// havaittu "outo punainen reunus". Palauttaa {alpha, sourceIdx}: sourceIdx
// osoittaa mista alkuperaisesta (aidosti puskurilla olevasta) pikselista
// vari haetaan. Kahden 1D-pyyhkaisyn Chebyshev-etaisyys riittaa taman
// kosmeettisen tarkoituksen (ei tarvitse tarkkaa euklidista lahinta).
//
// HAKU ETENEE ULOSPAIN KESKELTA ja katkeaa ensimmaiseen osumaan. Aiempi
// versio kavi aina koko ikkunan (-r..+r) lapi etsien minimietaisyytta,
// vaikka lahin osuma loytyy tyypillisesti heti.
//
// Mitattu 1714x1714 tiilella (peittomaskissa 108 021 px = 3,7 %) niin,
// etta molemmat versiot poimittiin tasta tiedostosta samalla tavalla ja
// ajettiin samassa V8-kontekstissa - muuten vertailu ei ole reilu:
//   paksuus  1 px: 4,2 -> 3,5 ms    10 px: 79,4 -> 43,0 ms  (1,8x)
//            5 px: 43,6 -> 21,9 ms  20 px: 133,2 -> 74,1 ms (1,8x)
// Tulos on BITILLEEN SAMA kaikilla THICKNESS_PRESETS-arvoilla (verrattu
// kaikki 2 937 796 pikselia seka alfasta etta lahdeindeksista): kun
// jokaisella etaisyydella d tarkistetaan -d ennen +d:ta, tasapelit
// ratkeavat kuten ennenkin (vanha silmukka kohtasi -d ensin ja vertasi
// aidosti pienempaan).
function dilateWithNearestColor(alpha, w, h, radiusPx) {
  if (radiusPx <= 0) {
    const idx = new Int32Array(w * h);
    for (let i = 0; i < w * h; i++) idx[i] = alpha[i] ? i : -1;
    return { alpha, sourceIdx: idx };
  }

  const tmpAlpha = new Uint8Array(w * h);
  const tmpIdx = new Int32Array(w * h).fill(-1);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      const i = row + x;
      if (alpha[i]) { tmpAlpha[i] = 1; tmpIdx[i] = i; continue; }
      for (let d = 1; d <= radiusPx; d++) {
        const xm = x - d, xp = x + d;
        if (xm >= 0 && alpha[row + xm]) { tmpAlpha[i] = 1; tmpIdx[i] = row + xm; break; }
        if (xp < w && alpha[row + xp]) { tmpAlpha[i] = 1; tmpIdx[i] = row + xp; break; }
      }
    }
  }

  const outAlpha = new Uint8Array(w * h);
  const outIdx = new Int32Array(w * h).fill(-1);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      const i = y * w + x;
      if (tmpAlpha[i]) { outAlpha[i] = 1; outIdx[i] = tmpIdx[i]; continue; }
      for (let d = 1; d <= radiusPx; d++) {
        const ym = y - d, yp = y + d;
        if (ym >= 0 && tmpAlpha[ym * w + x]) { outAlpha[i] = 1; outIdx[i] = tmpIdx[ym * w + x]; break; }
        if (yp < h && tmpAlpha[yp * w + x]) { outAlpha[i] = 1; outIdx[i] = tmpIdx[yp * w + x]; break; }
      }
    }
  }
  return { alpha: outAlpha, sourceIdx: outIdx };
}

// Renderoi yhden tiilen halutulla nayttotilalla/paksuudella/prosentilla ja
// palauttaa data-URL:n (kaytetaan suoraan L.imageOverlay:n lahteena).
// VALIMUISTETTU (renderResultCache) - ilman tata pelkka panorointi (sama
// tiilijoukko nakymassa, ei muuttuneita saatimia) laukaisisi kalliin
// dilataatio+varityslaskennan JOKAISELLA 'moveend'-tapahtumalla, mika
// pudotti kuvataajuuden n. 17 fps:aan (mitattu) - VANHAN toteutuksen
// staattiset kuvat eivat karsi tasta koska selaimen HTTP-valimuisti
// hoitaa saman asian ilmaiseksi.
const renderResultCache = new Map();

// Pistemaara 0-1 valituista tekijoista. **Tama on selaimen puoli
// sopimuksesta** - backendin (backend/pipeline.py: score_from_components) on
// laskettava TASAN samoin, samassa jarjestyksessa, tai esilasketut "parhaat
// X %" -kynnysarvot eivat vastaa naytettya kuvaa.
//
// Valitsematta jaanyt tekija EI saa painoa 0 vaan poistuu kokonaan, ja
// jaljelle jaavat painot normalisoidaan summaksi 1 - muuten esim. pelkka
// jyrkkyys tuottaisi korkeintaan 0,50 pistetta ja koko kartta nayttaisi
// punaiselta. Suo on kertova rangaistus (ei painotettu termi); jos VAIN suo
// on valittuna, pohjapistemaara on 1.0.
function scoreFromComponents(slopeByte, distByte, rockBit, swampBit, mask, fetchM, windSpeed, obstacleH) {
  let total = 0;
  let weightSum = 0;
  if (mask & FACTOR_BITS.slope) { total += SLOPE_WEIGHT * (slopeByte / 255); weightSum += SLOPE_WEIGHT; }
  if (mask & FACTOR_BITS.dist) { total += DIST_WEIGHT * (distByte / 255); weightSum += DIST_WEIGHT; }
  if (mask & FACTOR_BITS.rock) {
    total += ROCK_WEIGHT * (rockBit ? ROCK_SCORE_YES : ROCK_SCORE_NO);
    weightSum += ROCK_WEIGHT;
  }
  if (mask & FACTOR_BITS.shelter) {
    total += SHELTER_WEIGHT * shelterScoreFromFetch(fetchM, windSpeed, obstacleH);
    weightSum += SHELTER_WEIGHT;
  }
  let score = weightSum > 0 ? total / weightSum : 1.0;
  if ((mask & FACTOR_BITS.swamp) && swampBit) score *= SWAMP_PENALTY_FACTOR;
  return score < 0 ? 0 : score > 1 ? 1 : score;
}

async function renderFactorTile(tileId, displayMode, thicknessPx, topPercent, mask) {
  // Tuuli kuuluu valimuistiavaimeen vain kun suojaisuus on mukana - muuten
  // sen muuttuminen mitatoisi valimuistin turhaan.
  const windOsa = (mask & FACTOR_BITS.shelter) ? `|${windKey()}` : '';
  const cacheKey = `${tileId}|${displayMode}|${thicknessPx}|${topPercent}|${mask}${windOsa}`;
  if (renderResultCache.has(cacheKey)) return renderResultCache.get(cacheKey);

  const { factors, tiebreak } = await loadFactorImages(tileId);
  // Karkipaikat lukevat SAMAN kanavarakenteen omasta kuvastaan, jossa arvot
  // on aggregoitu koko 5-30 m rantakaistaleen yli (ks. backend/pipeline.py:
  // compute_prime_components). Peittomaski on kummassakin sama 5-15 m
  // puskurivyohyke, joten kerrokset asettuvat tarkalleen paallekkain.
  const isPrime = displayMode === 'prime';
  const src = isPrime ? await loadPrimeImage(tileId) : factors;

  const w = src.width, h = src.height;
  const data = src.data; // RGBA: R=jyrkkyys, G=etaisyys, B=kallio/suo-bitit, A=peittomaski
  const tb = tiebreak.data; // R=tasapelinpurku (alfa 255 kaikkialla, ks. backend)

  // Pistemaara lasketaan kerran per pikseli ja talletetaan varin hakua
  // varten; "top"-tilassa tarvitaan lisaksi tasapelinpurku, jotta vertailu
  // kynnysarvoon vastaa backendin rank_from_components-laskentaa.
  const scoreByte = new Uint8Array(w * h);
  const alpha = new Uint8Array(w * h);
  const threshold = displayMode === 'score'
    ? 0
    : thresholdFor(mask, topPercent, isPrime ? 'prime' : 'normal');

  // Suojaisuus lukee valitun sektorin pyyhkaisymatkan omasta kuvaparistaan.
  const useShelter = (mask & FACTOR_BITS.shelter) !== 0;
  const tile = tileListCache.find((tl) => tl.tile_id === tileId);
  const ruudut = useShelter ? windSubgrid(tileWindField(tile.bounds_epsg3067, forecastHour)) : null;
  const fetchData = useShelter ? await loadFetchLevels(tileId) : null;
  const fetchLevels = fetchData ? fetchData.levels : null;
  const obstacleLevels = fetchData ? fetchData.obstacles : null;

  const sg = useShelter ? subgridIndex(w, h) : null;
  let px = -1, py = 0;
  for (let i = 0; i < w * h; i++) {
    if (++px === w) { px = 0; py++; }
    if (data[i * 4 + 3] === 0) { alpha[i] = 0; continue; }
    const bits = data[i * 4 + 2];
    let fetchM = 0, obstacleH = 0, windSpeed = 0;
    if (useShelter) {
      const tuuli = ruudut[sg.row[py] * WIND_SUBGRID + sg.col[px]];
      windSpeed = tuuli.speed;
      const wf = tuuli.wf;
      const a = FETCH_LEVEL_METRES[fetchLevels[i * FETCH_SECTORS + wf.lo]];
      const b = FETCH_LEVEL_METRES[fetchLevels[i * FETCH_SECTORS + wf.hi]];
      fetchM = a + (b - a) * wf.frac;
      const oa2 = dequantiseObstacle(obstacleLevels[i * FETCH_SECTORS + wf.lo]);
      const ob2 = dequantiseObstacle(obstacleLevels[i * FETCH_SECTORS + wf.hi]);
      obstacleH = oa2 + (ob2 - oa2) * wf.frac;
    }
    const score = scoreFromComponents(data[i * 4], data[i * 4 + 1], bits & 1, bits & 2, mask,
                                      fetchM, windSpeed, obstacleH);
    scoreByte[i] = Math.round(score * 255);
    if (displayMode === 'score') {
      alpha[i] = 1;
    } else {
      const rank = score + TIEBREAK_EPSILON * (tb[i * 4] / 255);
      alpha[i] = rank >= threshold ? 1 : 0;
    }
  }

  const radiusPx = Math.round(thicknessPx / NEW_PIXEL_FACTOR);
  const out = new Uint8ClampedArray(w * h * 4);

  if (displayMode === 'score') {
    // Varin lahde pitaa haketa lahimmasta AIDOSTI puskurilla olevasta
    // pikselista, ei dilatoidun pikselin omasta (mahdollisesti puskurin
    // ulkopuolisesta) raa'asta arvosta - ks. dilateWithNearestColor-kommentti.
    const { alpha: dilated, sourceIdx } = dilateWithNearestColor(alpha, w, h, radiusPx);
    for (let i = 0; i < w * h; i++) {
      if (!dilated[i]) continue;
      const [r, g, b] = SCORE_COLOR_LUT[scoreByte[sourceIdx[i]]];
      out[i * 4] = r; out[i * 4 + 1] = g; out[i * 4 + 2] = b; out[i * 4 + 3] = 230;
    }
  } else {
    // Korostuskerroksissa vari on aina kiintea - dilatoidun pikselin
    // alkuperalla ei ole vaikutusta varin oikeellisuuteen.
    const rgb = isPrime ? PRIME_HIGHLIGHT_RGB : TOP_HIGHLIGHT_RGB;
    const dilated = dilateAlpha(alpha, w, h, radiusPx);
    for (let i = 0; i < w * h; i++) {
      if (!dilated[i]) continue;
      out[i * 4] = rgb[0];
      out[i * 4 + 1] = rgb[1];
      out[i * 4 + 2] = rgb[2];
      out[i * 4 + 3] = 230;
    }
  }

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').putImageData(new ImageData(out, w, h), 0, 0);
  const dataUrl = canvas.toDataURL('image/png');
  renderResultCache.set(cacheKey, dataUrl);
  return dataUrl;
}

// Kynnysarvo valitulle tekijayhdistelmalle ja prosentille. Jos taulukkoa ei
// jostain syysta saatu ladattua, palautetaan aareton = "top"-kerros jaa
// tyhjaksi mieluummin kuin nayttaa mielivaltaisen alueen.
// Kynnysarvo valitulle tekijayhdistelmalle, kerrokselle ja prosentille.
// Suojaisuuden mukana kynnys riippuu MYOS tuulesta, jolloin se haetaan
// omasta taulukostaan (maski -> sektori -> nopeusluokka -> prosentti).
function thresholdFor(mask, topPercent, layer) {
  let value;
  if (mask & FACTOR_BITS.shelter) {
    // Kynnys on laskettu TYYNESSA eika riipu tuulesta: "parhaat X %"
    // tarkoittaa "paikat jotka olisivat parhaan X %:n joukossa tyynella",
    // ja tuuli voi vain pudottaa paikkoja pois.
    value = shelterThresholds
      && shelterThresholds[layer]
      && shelterThresholds[layer][String(mask)]
      && shelterThresholds[layer][String(mask)][String(topPercent)];
  } else {
    const table = layer === 'prime' ? primeThresholds : factorThresholds;
    value = table && table[String(mask)] && table[String(mask)][String(topPercent)];
  }
  // Puuttuva kynnys -> aareton, jolloin kerros jaa mieluummin tyhjaksi kuin
  // nayttaa mielivaltaisen alueen.
  return typeof value === 'number' ? value : Infinity;
}

let newRenderGeneration = 0;

async function refreshNew() {
  const visible = visibleTiles();
  const myGeneration = ++newRenderGeneration;
  const mask = factorMask();
  if (currentDisplay === 'prime') await ensurePrimeThresholds();
  if (currentDisplay !== 'paddle' && (mask & FACTOR_BITS.shelter)) await ensureShelterThresholds();
  const rendered = await Promise.all(
    visible.map(async (tile) => ({
      tile,
      dataUrl: currentDisplay === 'paddle'
        ? await renderPaddleTile(tile.tile_id)
        : await renderFactorTile(tile.tile_id, currentDisplay, currentThickness, currentTopPercent, mask),
    }))
  );
  if (myGeneration !== newRenderGeneration) return; // uudempi pyynto on jo kaynnissa/valmis, hylataan tama
  newGroup.clearLayers();
  rendered.forEach(({ tile, dataUrl }) => {
    L.imageOverlay(dataUrl, tileLatLngBounds(tile), { opacity: 1 }).addTo(newGroup);
  });
}


function refreshActive() {
  if (!tileListCache.length) return;
  saveViewState();
  // Pallot sailyvat nakymasta toiseen - tuuli ja aallokko eivat riipu siita
  // mita kartalla varitetaan.
  updateInfoBubbles();
  refreshBase();
  refreshNew().catch((err) => console.error('Renderointi epaonnistui:', err));
}

function switchActiveGroup() {
  if (!map.hasLayer(newGroup)) map.addLayer(newGroup);
  refreshActive();
}

map.on('zoomend moveend', () => refreshActive());

// Asetussivulta paluu: 'pageshow' kattaa seka tavallisen latauksen etta
// selaimen takaisin-napin (bfcache, jolloin skriptia ei ajeta uudelleen).
// Tekijavalinnan muutos mitatoi renderointivalimuistin vain avaimen kautta
// (mask on osa avainta), joten mitaan ei tarvitse tyhjentaa kasin.
window.addEventListener('pageshow', () => {
  const changed = applySettings();
  // updateLegendFromSettings voi vaihtaa toteutuksen ('old' -> 'new', jos
  // tekijavalinta ei enaa ole taydellinen), joten kerrosryhma on vaihdettava
  // eika pelkka sisalto paivitettava - switchActiveGroup tekee molemmat.
  updateLegendFromSettings();
  if (changed && tileListCache.length) switchActiveGroup();
});

// ══════════════ MOBIILIKUOREN LOGIIKKA ══════════════
//
// Kuori EI PIDA OMAA TILAA. Jokainen painallus ohjaa samaa radiopainiketta
// tai liukusaadinta jota tyopoytanakymakin kayttaa, ja tila luetaan takaisin
// niista. Nain nakymat eivat voi ajautua erilleen, ja jos mobiilikuori
// poistettaisiin, mikaan ei rikkoutuisi.
//
// "Parhaat rantautumispaikat" (display-mode = "top") ei ole alapalkissa:
// kolme valilehtea mahtuu 430 px:iin luettavana, nelja ei. Se on yha
// valittavissa paneelin kautta, ja tulee myohemmin osaksi Ranta-valintaa.
const MOBILE_MAX_WIDTH = 700;
const MOBILE_TABS = ['score', 'prime', 'paddle'];

function isMobileLayout() {
  return window.matchMedia(`(max-width: ${MOBILE_MAX_WIDTH}px)`).matches;
}

function setupMobileShell() {
  const legendEl = document.querySelector('.legend');
  const panelBtn = document.getElementById('m-panel-btn');
  if (!legendEl || !panelBtn) return;

  // Paneelin avaus. Leaflet nappaa muuten kosketukset kartalle, joten
  // tapahtumat on pysaytettava - sama syy kuin tietopallojen kasittelyssa.
  const setPanel = (auki) => {
    legendEl.classList.toggle('m-open', auki);
    panelBtn.setAttribute('aria-expanded', String(auki));
  };
  panelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setPanel(!legendEl.classList.contains('m-open'));
  });
  L.DomEvent.disableClickPropagation(legendEl);
  L.DomEvent.disableScrollPropagation(legendEl);
  // Kartan napautus sulkee paneelin: pallon lisays on kartan paatoiminto
  // eika sen pida jaada paneelin alle.
  map.on('click', () => setPanel(false));

  // Nayttotilan radiot piiloon mobiilissa - valilehdet hoitavat saman.
  const modeRow = document.querySelector('input[name="display-mode"]');
  if (modeRow && modeRow.closest('.radio-row')) {
    modeRow.closest('.radio-row').classList.add('m-hide-modes');
  }

  document.querySelectorAll('.m-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      const radio = document.querySelector(`input[name="display-mode"][value="${tab.dataset.layer}"]`);
      if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
      setPanel(false);
      syncMobileShell();
    });
  });

  // Aikajana peilaa legendan forecast-hour-saadinta molempiin suuntiin.
  const mSlider = document.getElementById('m-time-input');
  mSlider.addEventListener('input', () => {
    const src = document.getElementById('forecast-hour');
    if (!src) return;
    src.value = mSlider.value;
    src.dispatchEvent(new Event('input', { bubbles: true }));
    syncMobileShell();
  });

  syncMobileShell();
}

// Paivittaa kuoren nykyisesta tilasta. Kutsutaan aina kun legenda
// paivittyy, jotta kuori ei jaa jalkeen.
function syncMobileShell() {
  if (!document.querySelector('.m-top')) return;

  document.querySelectorAll('.m-tab').forEach((tab) => {
    tab.classList.toggle('m-active', tab.dataset.layer === currentDisplay);
  });
  // "top" ei ole valilehdilla; korostetaan lahin sukulainen jottei
  // alapalkki nayta silta kuin mitaan ei olisi valittuna.
  if (!MOBILE_TABS.includes(currentDisplay)) {
    const score = document.querySelector('.m-tab[data-layer="score"]');
    if (score) score.classList.add('m-active');
  }

  const aika = document.getElementById('m-time');
  const src = document.getElementById('forecast-hour');
  const ennuste = currentWind.source !== 'kasin' && forecast.hours && forecast.hours.length > 0;
  aika.classList.toggle('m-disabled', !ennuste);

  const mSlider = document.getElementById('m-time-input');
  const maxH = ennuste ? Math.max(0, forecast.hours.length - 1) : 0;
  mSlider.max = String(maxH);
  mSlider.value = String(Math.min(forecastHour, maxH));

  const osuus = maxH > 0 ? (Number(mSlider.value) / maxH) * 100 : 0;
  document.getElementById('m-track-fill').style.width = `${osuus}%`;
  document.getElementById('m-track-tick').style.left = `${osuus}%`;
  document.getElementById('m-track-knob').style.left = `${osuus}%`;
  // Kello on 72 px levea ja keskitetty osoittimeen. Janan paissa se
  // leikkautuisi ruudun ulkopuolelle, joten keskipiste rajataan puolikkaan
  // leveyden paahan reunasta. Osoitin itse saa yha liikkua paihin asti.
  const kello = document.getElementById('m-clock');
  const rata = document.querySelector('.m-track');
  if (rata && rata.offsetWidth) {
    const puolikas = kello.offsetWidth ? kello.offsetWidth / 2 : 36;
    const x = (osuus / 100) * rata.offsetWidth;
    kello.style.left = `${Math.min(Math.max(x, puolikas), rata.offsetWidth - puolikas)}px`;
  } else {
    kello.style.left = `${osuus}%`;
  }

  // Kello nayttaa saman ajan kuin legenda; kasisaadossa ei aikaa ole.
  const aikaTeksti = document.getElementById('forecast-time');
  document.getElementById('m-clock-face').textContent =
    ennuste && aikaTeksti && aikaTeksti.textContent && aikaTeksti.textContent !== '–'
      ? aikaTeksti.textContent.replace(/^\S+\s+/, '')   // "ma 14:00" -> "14:00"
      : '–';

  document.getElementById('m-time-start').textContent = ennuste ? 'nyt' : 'käsin säädetty';
  document.getElementById('m-time-end').textContent = ennuste ? `+${maxH} h` : '';

  // Vuorokauden vaihtuminen: ensimmainen hetki jonka paiva eroaa alusta.
  const paiva = document.getElementById('m-day');
  const paivaLabel = document.getElementById('m-day-label');
  let naytaPaiva = false;
  if (ennuste && forecast.hours.length > 1) {
    const eka = new Date(forecast.hours[0] * 1000).getDate();
    for (let i = 1; i < forecast.hours.length; i++) {
      if (new Date(forecast.hours[i] * 1000).getDate() !== eka) {
        const pros = (i / maxH) * 100;
        paiva.style.left = `${pros}%`;
        paivaLabel.style.left = `${pros}%`;
        naytaPaiva = true;
        break;
      }
    }
  }
  paiva.hidden = !naytaPaiva;
  paivaLabel.hidden = !naytaPaiva;
}

// --- VEKTORITASOT: VAYLAT, SUOJELUALUEET JA PALVELUT ---
//
// Aineisto on haettu build-vaiheessa staattisiin tiedostoihin (ks.
// backend/vektoritasot.py). Selain ei kutsu ulkoisia rajapintoja - kartta
// toimii siis myos ilman verkkoa, mika on koko staattisen arkkitehtuurin syy.
//
// KOORDINAATIT OVAT VALMIIKSI EPSG:3067-METREJA. GeoJSON tallettaa parin
// muodossa [ita, pohjoinen] ja L.CRS.Simple lukee [pohjoinen, ita], joten
// ainoa muunnos on parin jarjestyksen vaihto. Ei projektiokirjastoa.
function toLatLngs(coords) {
  if (typeof coords[0] === 'number') return [coords[1], coords[0]];
  return coords.map(toLatLngs);
}

// Kauppamerenkulun paavaylat (VL1) ja 2-luokan vaylat (VL2) erottuvat muista
// selvasti. Ne ovat tassa joukossa ainoa TURVALLISUUSASIA: niilla liikkuu
// satojen metrien rahtialuksia, jotka eivat vaista eivatka pysty pysahtymaan.
// Loput vaylaluokat ovat veneilya ja hyotyliikennetta eli navigointiapua.
const VAYLA_STYLE = {
  rahti: { color: '#c62828', weight: 4, opacity: 0.85 },
  vene: { color: '#1565c0', weight: 1.5, opacity: 0.55, dashArray: '5,4' },
};

const PALVELU_TYYLI = {
  kauppa: ['#2e7d32', 'Kauppa'],
  sauna: ['#8d6e63', 'Sauna'],
  majoitus: ['#6a1b9a', 'Majoitus'],
  leirinta: ['#00838f', 'Leirintä'],
  katos: ['#ef6c00', 'Katos'],
  nuotio: ['#d84315', 'Nuotio-/grillipaikka'],
  vesi: ['#0277bd', 'Juomavesi'],
  kaymala: ['#546e7a', 'Käymälä'],
  luiska: ['#455a64', 'Veneluiska'],
  satama: ['#1565c0', 'Venesatama'],
  polttoaine: ['#37474f', 'Polttoaine'],
};

const SUOJELU_TYYPPI = {
  lintualue: 'Natura-lintualue',
  luontoalue: 'Natura-luontoalue',
  valtio: 'Valtion suojelualue',
  yksityinen: 'Yksityinen suojelualue',
};

function piirraVaylat(data) {
  vaylaGroup.clearLayers();
  const tasot = data.tasot || {};
  // Vaylaalueet ensin, jotta viivat jaavat niiden paalle.
  (tasot.vaylaalueet || []).forEach((f) => {
    const syvyys = f.p.haraussyvyys;
    L.polygon(toLatLngs(f.g.coordinates), {
      pane: 'vektorit', color: '#1565c0', weight: 0.8, opacity: 0.35,
      fillColor: '#1565c0', fillOpacity: 0.07, interactive: false,
    }).addTo(vaylaGroup);
    if (syvyys) { /* syvyys naytetaan vaylan tooltipissa, ei erikseen alueella */ }
  });
  (tasot.vaylat || []).forEach((f) => {
    const luokka = f.p.vaylaluokkakoodi;
    const rahti = luokka === 1 || luokka === 2;
    const line = L.polyline(toLatLngs(f.g.coordinates), {
      pane: 'vektorit', ...(rahti ? VAYLA_STYLE.rahti : VAYLA_STYLE.vene),
    }).addTo(vaylaGroup);
    const osat = [f.p.nimifi, f.p.vaylaluokkafi].filter(Boolean);
    if (rahti) osat.push('Kauppamerenkulkua — väistä');
    line.bindTooltip(osat.join('<br>'), { sticky: true });
  });
  (tasot.rajoitusalueet || []).concat(tasot.nopeusrajoitukset || []).forEach((f) => {
    L.polygon(toLatLngs(f.g.coordinates), {
      pane: 'vektorit', color: '#ef6c00', weight: 1.2, opacity: 0.7,
      fillColor: '#ef6c00', fillOpacity: 0.08,
    }).addTo(vaylaGroup)
      .bindTooltip(f.p.nimi || f.p.kuvaus || 'Rajoitusalue', { sticky: true });
  });
}

function piirraSuojelu(data) {
  suojeluGroup.clearLayers();
  Object.entries(data.tasot || {}).forEach(([avain, piirteet]) => {
    piirteet.forEach((f) => {
      L.polygon(toLatLngs(f.g.coordinates), {
        pane: 'vektorit', color: '#2e7d32', weight: 1.5, opacity: 0.8,
        fillColor: '#2e7d32', fillOpacity: 0.12,
      }).addTo(suojeluGroup)
        // Sanamuoto ei lupaa mitaan: aineisto kertoo VAIN rajauksen, ei
        // sita saako rantautua (ks. backend/vektoritasot.py).
        .bindTooltip(`${f.p.nimi || SUOJELU_TYYPPI[avain]}<br>`
          + `<small>${f.p.tyyppinimi || SUOJELU_TYYPPI[avain]} — tarkista järjestyssääntö</small>`,
          { sticky: true });
    });
  });
}

function piirraPalvelut(data) {
  palveluGroup.clearLayers();
  (data.kohteet || []).forEach((k) => {
    const [vari, nimi] = PALVELU_TYYLI[k.r] || ['#555', k.r];
    L.circleMarker([k.y, k.x], {
      pane: 'vektorit', radius: 5, color: '#fff', weight: 1.5,
      fillColor: vari, fillOpacity: 0.95,
    }).addTo(palveluGroup)
      .bindTooltip(k.n ? `${k.n}<br><small>${nimi}</small>` : nimi, { sticky: true });
  });
}

// --- LEVATILANNE ---
//
// Datakuvan kanavat (ks. backend/leva.py: _kirjoita_png):
//   R = luokka 0-3, 254 = maa, 255 = merta jota ei ole nahty
//   G = havainnon ika vuorokausina
//   B = luotettavuus 0-255
//   A = 255 aina (esikerrottu alfa turmelisi RGB:n getImageData:ssa)
//
// KOLME ERI SYYTA OLLA VARITTAMATTA, ja ne on erotettava toisistaan:
//   maa              ei piirreta lainkaan
//   nakematta jaanyt oma harmaa savynsa - tieto puuttuu
//   epavarma havainto varillinen mutta haalea
//
// Ilman keskimmaista kayttaja lukisi nakemattoman meren "ei levaa" -tilaksi,
// mika on tasan vaara suuntaan erehtyminen. Kattavuus on rannan lahella
// heikko (mitattuna alle 500 m paassa noin 11 %), joten harmaata on paljon -
// ja juuri siksi sen on nakyttava.
const LEVA_VARIT = { 0: [43, 126, 168], 1: [255, 255, 201],
                     2: [255, 220, 40], 3: [205, 51, 1] };
const LEVA_EI_HAVAINTOA = [96, 98, 108];
// Alfan alaraja: erittain epavarma havainto ei saa kadota nakyvista, koska
// katoaminen naytaisi samalta kuin "ei havaintoa" - se on eri asia.
// Ylaraja on korkea, koska peruskartan meri on kirkkaan sininen ja
// vaalea keltainen (luokka 1) hukkuu sen alle pienemmalla peitolla.
const LEVA_ALFA_MIN = 0.20;
const LEVA_ALFA_MAX = 0.80;

// EI HAVAINTOA PIIRRETAAN VIIRUTUKSENA, ei tasavarina.
//
// Tasavari olisi VAARIN riippumatta savysta: se asettuisi samalle
// asteikolle varikoodattujen luokkien kanssa, ja kayttaja lukisi sen
// arvona ("harmaa = vahan levaa"). Viirutus on vakiintunut tapa sanoa
// "ei tietoa" juuri siksi, ettei se ole vari vaan kuvio - sita ei voi
// sekoittaa mittaustulokseen.
//
// Tama on aineiston yleisin tila rannan lahella (mitattuna alle 500 m
// paassa noin 89 % ilman havaintoa), joten sen on erotuttava selvasti.
const LEVA_VIIRU_JAKSO = 8;      // px
const LEVA_VIIRU_LEVEYS = 3;     // px
const LEVA_ALFA_EI_HAVAINTOA = 0.42;

let levaMeta = null;
let levaLoading = null;

function levaVarita(img) {
  const { width, height, data } = img;
  const ulos = new ImageData(width, height);
  const d = ulos.data;
  const viiruAlfa = Math.round(255 * LEVA_ALFA_EI_HAVAINTOA);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = (y * width + x) * 4;
      const luokka = data[i];
      if (luokka === 254) continue;               // maa: lapinakyva
      if (luokka === 255) {
        // Vino viiru: kuvio, ei vari.
        if ((x + y) % LEVA_VIIRU_JAKSO >= LEVA_VIIRU_LEVEYS) continue;
        d[i] = LEVA_EI_HAVAINTOA[0]; d[i + 1] = LEVA_EI_HAVAINTOA[1];
        d[i + 2] = LEVA_EI_HAVAINTOA[2]; d[i + 3] = viiruAlfa;
        continue;
      }
      const vari = LEVA_VARIT[luokka];
      if (!vari) continue;
      const luot = data[i + 2] / 255;
      d[i] = vari[0]; d[i + 1] = vari[1]; d[i + 2] = vari[2];
      d[i + 3] = Math.round(255 * (LEVA_ALFA_MIN
        + (LEVA_ALFA_MAX - LEVA_ALFA_MIN) * luot));
    }
  }
  return ulos;
}

async function piirraLeva() {
  const meta = await (await fetch('leva.json')).json();
  levaMeta = meta;
  levaGroup.clearLayers();
  for (const alue of meta.alueet) {
    const img = await loadImageData(alue.tiedosto, `leva ${alue.tiedosto}`);
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').putImageData(levaVarita(img), 0, 0);
    const b = alue.bounds_epsg3067;
    L.imageOverlay(canvas.toDataURL('image/png'),
                   [[b.miny, b.minx], [b.maxy, b.maxx]],
                   { pane: 'leva', opacity: 1, interactive: false })
      .addTo(levaGroup);
    alue._img = img;      // pallo lukee arvot tasta, ei varitetysta
  }
  (meta.lahteet || []).forEach((l) => vectorAttribution(
    { lahde: l.nimi, lisenssi: l.lisenssi }));
  const el = document.getElementById('leva-legenda');
  if (el) el.style.display = '';
}

// Levahavainto pisteessa, tai null. Palauttaa raa'at arvot - sanamuoto
// paatetaan pallossa.
function levaOsuma(latlng) {
  if (!levaMeta) return null;
  for (const alue of levaMeta.alueet) {
    const b = alue.bounds_epsg3067;
    if (latlng.lng < b.minx || latlng.lng >= b.maxx
        || latlng.lat < b.miny || latlng.lat >= b.maxy) continue;
    const img = alue._img;
    if (!img) continue;
    const col = Math.floor((latlng.lng - b.minx) / (b.maxx - b.minx) * img.width);
    const row = Math.floor((b.maxy - latlng.lat) / (b.maxy - b.miny) * img.height);
    const i = (row * img.width + col) * 4;
    const luokka = img.data[i];
    if (luokka === 254) return null;              // maa
    if (luokka === 255) return { nakematta: true };
    return { luokka, ika: img.data[i + 1], luotettavuus: img.data[i + 2] / 255 };
  }
  return null;
}

const VECTOR_SOURCES = {
  vaylat: ['/api/vaylat', piirraVaylat],
  suojelu: ['/api/suojelualueet', piirraSuojelu],
  palvelut: ['/api/palvelut', piirraPalvelut],
};

// Ladataan VASTA kun taso otetaan kayttoon: kartan ensilataus ei saa hidastua
// aineistosta jota kayttaja ei ehka katso lainkaan.
async function ensureVectorLayer(avain) {
  // Leva ei ole vektoritaso vaan datakuva, mutta sen elinkaari on sama:
  // ladataan vasta kun taso otetaan kayttoon, ja virhe kaataa vain tason.
  if (avain === 'leva') {
    if (!levaLoading) levaLoading = piirraLeva().catch((e) => {
      levaLoading = null; throw e;
    });
    return levaLoading;
  }
  if (vectorData[avain]) return vectorData[avain];
  if (!vectorLoading[avain]) {
    const [url, piirra] = VECTOR_SOURCES[avain];
    vectorLoading[avain] = fetch(url).then((r) => r.json()).then((d) => {
      vectorData[avain] = d;
      piirra(d);
      vectorAttribution(d);
      return d;
    });
  }
  return vectorLoading[avain];
}

const vectorAttributionsAdded = new Set();
function vectorAttribution(data) {
  const teksti = `${data.lahde} (${data.lisenssi})`;
  if (vectorAttributionsAdded.has(teksti)) return;
  vectorAttributionsAdded.add(teksti);
  map.attributionControl.addAttribution(teksti);
  // Leafletin attribuutiokontrolli on piilotettu kapeilla naytoilla, joten
  // lahteet toistetaan legendassa. CC BY ja ODbL EDELLYTTAVAT nimeamista -
  // se ei ole kohteliaisuus.
  const el = document.getElementById('lahteet');
  if (el) el.textContent = 'Lähteet: ' + [...vectorAttributionsAdded].join(', ');
}

async function setOverlay(avain, paalla) {
  if (paalla) activeOverlays.add(avain); else activeOverlays.delete(avain);
  saveViewState();
  const { group } = OVERLAYS[avain];
  if (!paalla) { map.removeLayer(group); return; }
  group.addTo(map);
  try {
    await ensureVectorLayer(avain);
  } catch (err) {
    // Taso jaa tyhjaksi mutta kartta toimii - sama periaate kuin
    // saaennusteella: kerros ei kaadu ulkoisen tiedoston mukana.
    map.removeLayer(group);
    activeOverlays.delete(avain);
    const box = document.querySelector(`input[name="overlay"][value="${avain}"]`);
    if (box) box.checked = false;
  }
}

// --- SUOJELUALUEOSUMA TIETOPALLOON ---
//
// Piste-polygonissa -testi tehdaan selaimessa, koska pallot sijoitetaan
// ajonaikaisesti. Polygoneja on vahan (mitattuna 202 kpl 50x50 km alueella),
// joten esilaskentaa tai hakupuuta ei tarvita.
function pisteMonikulmiossa(y, x, rengas) {
  let osuu = false;
  for (let i = 0, j = rengas.length - 1; i < rengas.length; j = i++) {
    const xi = rengas[i][0], yi = rengas[i][1];
    const xj = rengas[j][0], yj = rengas[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) osuu = !osuu;
  }
  return osuu;
}

// Reiat huomioidaan: ensimmainen rengas on ulkoreuna, loput reikia.
function osuuGeometriaan(y, x, geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  return polys.some((poly) => pisteMonikulmiossa(y, x, poly[0])
    && !poly.slice(1).some((reika) => pisteMonikulmiossa(y, x, reika)));
}

// Palauttaa alueen jonka sisalla piste on, tai null. Vaatii etta
// suojelualuetaso on ladattu - muuten palloon ei tule mitaan, mika on oikein:
// tietoa ei ole, eika sita saa keksia.
function suojeluOsuma(latlng) {
  const d = vectorData.suojelu;
  if (!d) return null;
  for (const [avain, piirteet] of Object.entries(d.tasot || {})) {
    for (const f of piirteet) {
      if (osuuGeometriaan(latlng.lat, latlng.lng, f.g)) {
        return { nimi: f.p.nimi || SUOJELU_TYYPPI[avain],
                 tyyppi: f.p.tyyppinimi || SUOJELU_TYYPPI[avain] };
      }
    }
  }
  return null;
}

// Tiilijoukon sormenjalki nakymatilan vanhenemisen tunnistamiseen. Pelkka
// lukumaara ei riittaisi: tiili voitaisiin vaihtaa toiseen ilman etta maara
// muuttuu. Tunnisteista laskettu tiiviste on halpa ja tasmallinen.
function tileFingerprint(tileList) {
  const s = tileList.map((t) => t.tile_id).sort().join(',');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}

// Suurin yhtenainen tiiliryhma. Tiilet ovat samankokoisia ja ruudukossa,
// joten "yhtenainen" = koskettaa reunasta tai kulmasta. Sama jako tehdaan
// build-vaiheessa vektoritasojen hakua varten (backend/vektoritasot.py:
// alueen_bboxit) - jos toista muuttaa, muuta myos toinen.
function largestCluster(tileList) {
  if (tileList.length < 2) return tileList;
  const b0 = tileList[0].bounds_epsg3067;
  const koko = b0.maxx - b0.minx;
  const ruudut = new Map();
  tileList.forEach((t) => {
    const b = t.bounds_epsg3067;
    ruudut.set(`${Math.round(b.minx / koko)},${Math.round(b.miny / koko)}`, t);
  });
  const kaymatta = new Set(ruudut.keys());
  let paras = [];
  while (kaymatta.size) {
    const alku = kaymatta.values().next().value;
    kaymatta.delete(alku);
    const pino = [alku];
    const ryhma = [ruudut.get(alku)];
    while (pino.length) {
      const [gx, gy] = pino.pop().split(',').map(Number);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const avain = `${gx + dx},${gy + dy}`;
          if (kaymatta.has(avain)) {
            kaymatta.delete(avain);
            pino.push(avain);
            ryhma.push(ruudut.get(avain));
          }
        }
      }
    }
    if (ryhma.length > paras.length) paras = ryhma;
  }
  return paras;
}

async function init() {
  const statusEl = document.getElementById('status');
  applySettings();

  const [res, thresholdsRes] = await Promise.all([
    fetch('/api/tiles'),
    fetch('/api/factor-thresholds'),
  ]);
  const tileList = await res.json();
  factorThresholds = await thresholdsRes.json();
  tileListCache = tileList;
  updateLegendFromSettings();

  // Palautetaan edellinen tila jos sellainen on - esimerkiksi asetussivulta
  // palatessa. Muuten avataan oletusnakyma.
  const saved = loadViewState();
  if (saved) {
    if (['score', 'top', 'prime', 'paddle'].includes(saved.display)) currentDisplay = saved.display;
    if (saved.wind && isFinite(saved.wind.speed) && isFinite(saved.wind.direction)) {
      currentWind = {
        direction: saved.wind.direction, speed: saved.wind.speed,
        gust: isFinite(saved.wind.gust) ? saved.wind.gust : saved.wind.speed * DEFAULT_GUST_FACTOR,
        source: ['kasin', 'fmi', 'met'].includes(saved.wind.source) ? saved.wind.source : 'kasin',
      };
    }
    if (isFinite(saved.hour)) forecastHour = saved.hour;
    const radio = document.querySelector(`input[name="display-mode"][value="${currentDisplay}"]`);
    if (radio) radio.checked = true;
    map.setView([saved.lat, saved.lng], saved.zoom);
  }

  // TALLENNETTU NAKYMA VANHENEE KUN AINEISTO LAAJENEE.
  //
  // Kun Helsingin edusta lisattiin, tallennettu tila osoitti Ahvenanmaalle ja
  // uusi alue oli 200 km ruudun ulkopuolella. Nakymassa oli tiilia, joten
  // mikaan ei nayttanyt rikkinaiselta - kayttajan silmissa laajennusta ei
  // vain ollut olemassa. "Onko nakymassa yhtaan tiilta" ei siis riita
  // ehdoksi, vaan on kysyttava onko TIILIJOUKKO muuttunut.
  //
  // Sormenjalki tallennetaan nakymatilaan (ks. saveViewState). Jos se eroaa,
  // nakyma sovitetaan uudelleen; muuten kayttajan oma sijainti ja zoom
  // sailyvat kuten ennenkin.
  const tallennettuKelpaa = saved && saved.tiles === tileFingerprint(tileList);
  const sovita = !tallennettuKelpaa;
  if (saved && !tallennettuKelpaa) {
    console.log('Tiilijoukko on muuttunut edellisen kayntikerran jalkeen - '
              + 'nakyma sovitetaan uudelleen.');
  }

  const allBounds = tileList.map(tileLatLngBounds);
  if (sovita && allBounds.length) {
    // Avataan hieman lahempaa kuin taysi "koko aineisto nakyvissa" -taso:
    // yksi zoom-askel enemman (L.CRS.Simple: 2x resoluutio per askel) eli
    // nakyvissa on karkeasti puolet koko aineiston fit-to-bounds-leveydesta.
    //
    // SUURIMPAAN KLUSTERIIN, ei kaikkien tiilien yli: aineisto voi koostua
    // erillisista alueista (Ahvenanmaa ja Helsingin edusta ovat yli 200 km
    // erillaan), jolloin kaikkien yli sovitettu nakyma olisi enimmakseen
    // tyhjaa merta eika kumpikaan alue nakyisi kunnolla.
    const overallBounds = L.latLngBounds(largestCluster(tileList).map(tileLatLngBounds));
    const fitZoom = map.getBoundsZoom(overallBounds);
    map.setView(overallBounds.getCenter(), fitZoom + 1);
  } else if (sovita && !allBounds.length) {
    map.setView([0, 0], -6);
  }

  if (saved && saved.tab) setLegendTab(saved.tab);
  // Lisatasot palautetaan ENNEN palloja, jotta suojelualueosuma on tiedossa
  // kun pallot piirretaan. Haku ei saa estaa kartan avautumista.
  if (saved && Array.isArray(saved.overlays)) {
    const palautettavat = saved.overlays.filter((a) => a in OVERLAYS);
    palautettavat.forEach((a) => {
      const box = document.querySelector(`input[name="overlay"][value="${a}"]`);
      if (box) box.checked = true;
    });
    try {
      await Promise.all(palautettavat.map((a) => setOverlay(a, true)));
    } catch (err) { /* tasot puuttuvat, kartta toimii silti */ }
  }
  if (saved && Array.isArray(saved.bubbles)) {
    saved.bubbles.filter((b) => Array.isArray(b) && isFinite(b[0]) && isFinite(b[1]))
      .forEach(([lat, lng]) => addInfoBubble(L.latLng(lat, lng)));
  }
  // Ennustelahde palautetaan, mutta se EI saa estaa kartan avautumista:
  // verkkoyhteys voi olla poikki tai rajapinta alhaalla, jolloin jaadaan
  // tallennettuun tuuleen.
  if (currentWind.source !== 'kasin') {
    try {
      await loadForecasts();
    } catch (err) {
      currentWind.source = 'kasin';
    }
  }
  updateLegendFromSettings();
  setupMobileShell();
  switchActiveGroup();
  statusEl.remove();
}

init().catch((err) => {
  document.getElementById('status').textContent = 'Virhe ladattaessa: ' + err;
});
</script>
